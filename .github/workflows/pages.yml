# Veröffentlicht die App als Website über GitHub Pages.
#
# EINMALIG NÖTIG (nur der Repository-Besitzer darf das, kein Workflow):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Ohne diesen Schalter bricht der Lauf mit "Get Pages site failed" ab.
# Danach: hier auf "Re-run jobs" drücken oder einmal pushen.
name: Website veröffentlichen

on:
  push:
    branches:
      - main
      - claude/leichtathletik-tracking-app-yz0v4k
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/assets
          cp index.html _site/
          cp assets/styles.css assets/app.js _site/assets/
          cp supabase/schema.sql _site/schema.sql
          python3 build.py _site/leichtathletik-tracker.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
