<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1F27">
<title>Leichtathletik Tracker</title>
<link rel="stylesheet" href="assets/styles.css?v=29dbfc38">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
</head>
<body>

<!-- Die gesamte Oberfläche liegt in einem template: unverändertes Original,
     aus dem die App beim Speichern in der Cloud die neue Seite bauen kann. -->
<template id="appShell">

<div id="bgverlauf" aria-hidden="true"></div>
<div id="bgfx" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">L</span>
    <span class="brand-text">Leichtathletik&nbsp;Tracker</span>
  </div>
  <span id="syncChip" class="sync-chip" title="Speicherort der Werte">…</span>
  <button id="profileBtn" class="profile-btn" title="Profil wechseln oder anlegen">
    <span id="profileName">Ich</span><span class="chev" aria-hidden="true">▾</span>
  </button>
</header>

<main>
  <!-- ============ ERFASSEN ============ -->
  <section id="view-erfassen" class="view is-active">
    <p class="greeting">Hallo <strong id="greetName">Ich</strong></p>
    <h1 class="view-title">Neuer Wert</h1>

    <div id="discGrid" class="disc-grid"></div>

    <form id="entryForm" class="entry-card" autocomplete="off">
      <div class="entry-head">
        <span id="entryDiscName" class="entry-disc">–</span>
        <span id="entryHint" class="entry-hint"></span>
      </div>

      <div class="input-row">
        <input id="valueInput" class="value-input" type="text" inputmode="decimal"
               placeholder="0.00" aria-label="Wert" required>
        <span id="valueUnit" class="value-unit"></span>
        <button type="submit" class="save-btn" title="Speichern (Enter)" aria-label="Speichern">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.6l5 5.2L19.5 6.4"/></svg>
        </button>
      </div>

      <p id="parsePreview" class="parse-preview">&nbsp;</p>

      <div id="dopplung" class="warnung" hidden>
        <p id="dopplungText" class="warnung-text"></p>
        <div class="warnung-knoepfe">
          <button type="button" id="dopplungJa" class="btn btn-sm btn-warnung">Trotzdem eintragen</button>
          <button type="button" id="dopplungNein" class="btn btn-sm">Abbrechen</button>
        </div>
      </div>

      <details class="extras">
        <summary>Datum &amp; Notiz</summary>
        <div class="extras-body">
          <div class="feld-paar">
            <label class="field">
              <span>Datum</span>
              <input id="dateInput" type="date">
            </label>
            <label class="field">
              <span>Uhrzeit</span>
              <input id="timeInput" type="time">
            </label>
          </div>
          <label class="field">
            <span>Notiz (optional)</span>
            <input id="noteInput" type="text" maxlength="80" placeholder="z.&nbsp;B. Bundesjugendspiele, Gegenwind …">
          </label>
        </div>
      </details>
    </form>

    <div class="last-block">
      <h2 class="section-title">Zuletzt erfasst</h2>
      <ul id="recentList" class="recent-list"></ul>
    </div>
  </section>

  <!-- ============ VERLAUF ============ -->
  <section id="view-verlauf" class="view">
    <h1 class="view-title">Verlauf</h1>

    <div id="chartTabs" class="chips"></div>

    <div class="chart-card">
      <div class="chart-head">
        <div>
          <h2 id="chartTitle" class="chart-title">–</h2>
          <p id="chartSub" class="chart-sub"></p>
        </div>
        <span id="chartTrend" class="trend"></span>
      </div>
      <div id="chartWrap" class="chart-wrap"></div>
      <div id="statsLine" class="stats-line"></div>
    </div>

    <details class="klapp" id="alleWerte">
      <summary>Alle Werte <span id="alleWerteZahl" class="sub"></span></summary>
      <div class="klapp-body">
        <ul id="discList" class="entry-list"></ul>
      </div>
    </details>
  </section>

  <!-- ============ PUNKTE ============ -->
  <section id="view-punkte" class="view">
    <h1 class="view-title">Punkte</h1>

    <div class="punkte-summe">
      <div class="ps-block">
        <span class="k">Fünfkampf</span>
        <span id="punkteSumme" class="v">–</span>
        <span id="punkteStatus" class="sub"></span>
      </div>
      <div class="ps-block ps-wa">
        <span class="k">Note</span>
        <span id="punkteNote" class="v">–</span>
        <span id="punkteNoteFein" class="sub"></span>
      </div>
    </div>

    <button type="button" class="wertung-zeile" data-ziel="einstellungen">
      <span id="wertungInfo">–</span><span class="mr-chev" aria-hidden="true">›</span>
    </button>

    <h2 class="section-title">Pflichtbereiche</h2>
    <ul id="voraussetzungen" class="vor-liste"></ul>

    <h2 class="section-title">Diese fünf zählen</h2>
    <ul id="punkteListe" class="entry-list"></ul>

    <details class="klapp">
      <summary>Alle Disziplinen <span class="sub">und wie gerechnet wird</span></summary>
      <div class="klapp-body">
        <ul id="punkteAlle" class="entry-list"></ul>
        <p id="punkteHinweis" class="hint-text"></p>
      </div>
    </details>
  </section>

  <!-- ============ PROFIL ============ -->
  <section id="view-profil" class="view">
    <h1 class="view-title">Profil</h1>

    <div class="profil-head">
      <span id="profilAvatar" class="p-avatar p-avatar-lg"></span>
      <div>
        <p class="greeting">Angemeldet als</p>
        <p id="profilName" class="profil-name">–</p>
        <p id="profilWerte" class="profil-sub"></p>
      </div>
    </div>
    <p class="hint-text" style="margin:8px 2px 0">Profil wechseln: oben rechts auf den Namen tippen.</p>

    <ul class="menu">
      <li>
        <button type="button" class="menu-row" data-ziel="einstellungen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2M12 18.5v2M20.5 12h-2M5.5 12h-2M18 6l-1.4 1.4M7.4 16.6 6 18M18 18l-1.4-1.4M7.4 7.4 6 6"/></svg>
          <span class="mr-text">
            <span class="mr-title">Einstellungen</span>
            <span class="mr-sub">Wertung, Farbe, Hintergrund, Datenbank, Daten</span>
          </span>
          <span class="mr-chev" aria-hidden="true">›</span>
        </button>
      </li>
      <li>
        <button type="button" class="menu-row" data-ziel="profile">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"/><path d="M2.8 19a6.2 6.2 0 0112.4 0"/><path d="M16 5.6a3.2 3.2 0 010 5.8M17.5 19a6.4 6.4 0 00-1.6-4.2"/></svg>
          <span class="mr-text">
            <span class="mr-title">Profile verwalten</span>
            <span id="profileAnzahl" class="mr-sub"></span>
          </span>
          <span class="mr-chev" aria-hidden="true">›</span>
        </button>
      </li>
    </ul>
  </section>

  <!-- ============ EINSTELLUNGEN ============ -->
  <section id="view-einstellungen" class="view" data-eltern="profil">
    <button type="button" class="zurueck" data-ziel="profil">‹ Profil</button>
    <h1 class="view-title">Einstellungen</h1>
    <p id="einstellungenFuer" class="view-note"></p>

    <details class="klapp" open>
      <summary>Wertung <span id="wertungKurz" class="sub"></span></summary>
      <div class="klapp-body">
        <div class="feld-zeile">
          <span class="feld-name">Tabelle</span>
          <div class="seg" id="genderSeg" role="group" aria-label="Wertungstabelle">
            <button type="button" class="seg-btn" data-wert="m">Jungen</button>
            <button type="button" class="seg-btn" data-wert="w">Mädchen</button>
          </div>
        </div>
        <div class="feld-zeile">
          <span class="feld-name">Zeitmessung</span>
          <div class="seg" id="zeitSeg" role="group" aria-label="Zeitmessung">
            <button type="button" class="seg-btn" data-wert="hand">Handzeit</button>
            <button type="button" class="seg-btn" data-wert="elektro">elektronisch</button>
          </div>
        </div>
        <div class="feld-zeile">
          <span class="feld-name">Altersklasse</span>
          <div class="seg" id="klasseSeg" role="group" aria-label="Altersklasse">
            <button type="button" class="seg-btn" data-wert="U18">U18</button>
            <button type="button" class="seg-btn" data-wert="U20">U20</button>
            <button type="button" class="seg-btn" data-wert="U23">U23</button>
          </div>
        </div>
        <div class="feld-zeile">
          <span class="feld-name">Geburtsjahr</span>
          <input id="jahrInput" type="number" inputmode="numeric" min="1950" max="2035" placeholder="2008" class="feld-eingabe">
        </div>
        <p id="wertungHinweis" class="hint-text"></p>
      </div>
    </details>

    <details class="klapp">
      <summary>Aussehen <span id="designKurz" class="sub"></span></summary>
      <div class="klapp-body">
        <h3 class="section-title">Farbe</h3>
        <div id="themeGrid" class="theme-grid"></div>

        <h3 class="section-title">Eigene Farbe <span id="eigenZahl" class="section-zahl"></span></h3>
        <form id="eigenForm" class="eigen-form" autocomplete="off">
          <input id="eigenWert" type="color" value="#7BF29C" aria-label="Farbe wählen">
          <input id="eigenName" type="text" maxlength="14" placeholder="Name, z.&nbsp;B. Türkis" aria-label="Name der Farbe">
          <button type="submit" class="btn btn-mint btn-sm">Hinzufügen</button>
        </form>
        <p id="eigenHinweis" class="hint-text"></p>

        <h3 class="section-title">Verlauf</h3>
        <div id="gradientGrid" class="theme-grid"></div>

        <h3 class="section-title">Hintergrund</h3>
        <div id="patternGrid" class="theme-grid"></div>
      </div>
    </details>

    <details class="klapp">
      <summary>Speicherort <span id="speicherKurz" class="sub"></span></summary>
      <div class="klapp-body">
        <div id="storageInfo" class="hint-text"></div>
        <div class="data-actions" id="storageActions"></div>
      </div>
    </details>

    <details class="klapp">
      <summary>Daten sichern <span class="sub">JSON, CSV</span></summary>
      <div class="klapp-body">
        <div class="data-actions">
          <button id="exportBtn" class="btn">⬇ Sichern (JSON)</button>
          <button id="importBtn" class="btn">⬆ Laden (JSON)</button>
          <button id="csvBtn" class="btn">⬇ CSV</button>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
        </div>
      </div>
    </details>

    <details class="klapp klapp-gefahr">
      <summary>Profil löschen <span class="sub">mit allen Werten</span></summary>
      <div class="klapp-body" id="loeschBereich"></div>
    </details>
  </section>

  <!-- ============ PROFILE VERWALTEN ============ -->
  <section id="view-profile" class="view" data-eltern="profil">
    <button type="button" class="zurueck" data-ziel="profil">‹ Profil</button>
    <h1 class="view-title">Profile</h1>
    <p class="view-note">Tippe auf einen Namen, um zu wechseln.</p>

    <ul id="profileList" class="profile-list"></ul>
    <div class="data-actions">
      <button type="button" id="profilNeuBtn" class="btn btn-mint">Neues Profil anlegen</button>
    </div>
    <p id="profileHint" class="hint-text"></p>
  </section>

</main>

<nav class="tabbar">
  <button class="tab is-active" data-view="erfassen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Erfassen
  </button>
  <button class="tab" data-view="verlauf">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-5 4 3 7-8"/><path d="M20 8h-4M20 8v4"/></svg>Verlauf
  </button>
  <button class="tab" data-view="punkte">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M9.5 19V5M15 19v-6M20.5 19V8"/></svg>Punkte
  </button>
  <button class="tab" data-view="profil">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0114.4 0"/></svg>Profil
  </button>
</nav>

<dialog id="dbDialog" class="sheet">
  <div class="sheet-head">
    <h2>Datenbank verbinden</h2>
    <button id="dbClose" class="icon-btn" aria-label="Schließen">✕</button>
  </div>

  <ol class="steps">
    <li>Auf <strong>supabase.com</strong> kostenlos anmelden und ein Projekt anlegen.</li>
    <li>Im Projekt links auf <strong>SQL Editor</strong>, das Schema einfügen und <strong>Run</strong> drücken.
      <button type="button" id="sqlCopy" class="btn btn-sm">SQL kopieren</button></li>
    <li>Unter <strong>Project Settings → API</strong> die <em>Project URL</em> und den
      <em>anon public</em>-Schlüssel kopieren.</li>
    <li>Hier eintragen, Klassen-Code frei wählen (mind. 6 Zeichen) und verbinden.</li>
  </ol>

  <form id="dbForm" class="db-form" autocomplete="off" novalidate>
    <label class="field">
      <span>Projekt-URL</span>
      <input id="dbUrl" type="url" placeholder="https://abcdefgh.supabase.co">
    </label>
    <label class="field">
      <span>anon public key</span>
      <input id="dbKey" type="text" placeholder="eyJhbGciOi…">
    </label>
    <label class="field">
      <span>Klassen-Code (das ist das Passwort für eure Gruppe)</span>
      <input id="dbCode" type="text" placeholder="z.&nbsp;B. 9b-sport-2026">
    </label>
    <div class="db-actions">
      <button type="submit" class="btn btn-mint">Verbinden</button>
      <button type="button" id="dbTest" class="btn" title="Prüfen, ob der Datenbank-Server erreichbar ist">Verbindung testen</button>
      <button type="button" id="dbShare" class="btn" hidden title="Projekt-URL und Key für die eigene Website kopieren">Für Website kopieren</button>
      <button type="button" id="dbDisconnect" class="btn" hidden>Trennen</button>
    </div>
  </form>
  <p id="dbHint" class="hint-text"></p>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite">
