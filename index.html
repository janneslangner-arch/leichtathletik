<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1F27">
<title>Leichtathletik Tracker</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>">
</head>
<body>

<!-- Die gesamte Oberfläche liegt in einem template: unverändertes Original,
     aus dem die App beim Speichern in der Cloud die neue Seite bauen kann. -->
<template id="appShell">

<header class="topbar">
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">L</span>
    <span class="brand-text">Leichtathletik&nbsp;Tracker</span>
  </div>
  <span id="syncChip" class="sync-chip" title="Speicherort der Werte">…</span>
  <button id="profileBtn" class="profile-btn" title="Profil wechseln oder anlegen">
    <span id="profileName">Ich</span><span class="chev" aria-hidden="true">▾</span>
  </button>
</header>

<main>
  <!-- ============ ERFASSEN ============ -->
  <section id="view-erfassen" class="view is-active">
    <h1 class="view-title">Neuer Wert</h1>

    <div id="discGrid" class="disc-grid"></div>

    <form id="entryForm" class="entry-card" autocomplete="off">
      <div class="entry-head">
        <span id="entryDiscName" class="entry-disc">–</span>
        <span id="entryHint" class="entry-hint"></span>
      </div>

      <div class="input-row">
        <input id="valueInput" class="value-input" type="text" inputmode="decimal"
               placeholder="0.00" aria-label="Wert" required>
        <span id="valueUnit" class="value-unit"></span>
        <button type="submit" class="save-btn" title="Speichern (Enter)">✓</button>
      </div>

      <p id="parsePreview" class="parse-preview">&nbsp;</p>

      <details class="extras">
        <summary>Datum &amp; Notiz</summary>
        <div class="extras-body">
          <label class="field">
            <span>Datum</span>
            <input id="dateInput" type="date">
          </label>
          <label class="field">
            <span>Notiz (optional)</span>
            <input id="noteInput" type="text" maxlength="80" placeholder="z.&nbsp;B. Bundesjugendspiele, Gegenwind …">
          </label>
        </div>
      </details>
    </form>

    <div class="last-block">
      <h2 class="section-title">Zuletzt erfasst</h2>
      <ul id="recentList" class="recent-list"></ul>
    </div>
  </section>

  <!-- ============ VERLAUF ============ -->
  <section id="view-verlauf" class="view">
    <h1 class="view-title">Verlauf</h1>

    <div id="chartTabs" class="chips"></div>

    <div class="chart-card">
      <div class="chart-head">
        <div>
          <h2 id="chartTitle" class="chart-title">–</h2>
          <p id="chartSub" class="chart-sub"></p>
        </div>
        <span id="chartTrend" class="trend"></span>
      </div>
      <div id="chartWrap" class="chart-wrap"></div>
      <p class="chart-legend"><span class="dot dot-pb"></span> Bestwert &nbsp;·&nbsp; <span class="dot dot-normal"></span> Messung &nbsp;·&nbsp; nach oben = besser</p>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <h2 class="section-title">Alle Werte</h2>
    <ul id="discList" class="entry-list"></ul>
  </section>

  <!-- ============ ÜBERSICHT ============ -->
  <section id="view-uebersicht" class="view">
    <h1 class="view-title">Übersicht</h1>
    <p class="view-note">Bestwerte von <strong id="overviewName">–</strong></p>
    <div id="overviewGrid" class="overview-grid"></div>

    <h2 class="section-title">Speicherort</h2>
    <div id="storageInfo" class="hint-text"></div>
    <div class="data-actions" id="storageActions"></div>

    <h2 class="section-title">Daten</h2>
    <div class="data-actions">
      <button id="exportBtn" class="btn">⬇ Sichern (JSON)</button>
      <button id="importBtn" class="btn">⬆ Laden (JSON)</button>
      <button id="csvBtn" class="btn">⬇ CSV</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button class="tab is-active" data-view="erfassen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Erfassen
  </button>
  <button class="tab" data-view="verlauf">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-5 4 3 7-8"/><path d="M20 8h-4M20 8v4"/></svg>Verlauf
  </button>
  <button class="tab" data-view="uebersicht">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v5a5 5 0 01-10 0V4z"/><path d="M17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/><path d="M12 14v3M9 20h6"/></svg>Übersicht
  </button>
</nav>

<!-- ============ Profile ============ -->
<dialog id="profileDialog" class="sheet">
  <div class="sheet-head">
    <h2>Profile</h2>
    <button id="profileClose" class="icon-btn" aria-label="Schließen">✕</button>
  </div>
  <ul id="profileList" class="profile-list"></ul>
  <form id="profileAddForm" class="profile-add" autocomplete="off">
    <input id="profileNewName" type="text" maxlength="24" placeholder="Name, z.&nbsp;B. Lena"
           aria-label="Name des neuen Profils">
    <button type="submit" class="btn btn-mint">Anlegen</button>
  </form>
  <p id="profileHint" class="hint-text">Jedes Profil hat eigene Werte. Tippe auf einen Namen, um zu wechseln.</p>
</dialog>

<dialog id="dbDialog" class="sheet">
  <div class="sheet-head">
    <h2>Datenbank verbinden</h2>
    <button id="dbClose" class="icon-btn" aria-label="Schließen">✕</button>
  </div>

  <ol class="steps">
    <li>Auf <strong>supabase.com</strong> kostenlos anmelden und ein Projekt anlegen.</li>
    <li>Im Projekt links auf <strong>SQL Editor</strong>, das Schema einfügen und <strong>Run</strong> drücken.
      <button type="button" id="sqlCopy" class="btn btn-sm">SQL kopieren</button></li>
    <li>Unter <strong>Project Settings → API</strong> die <em>Project URL</em> und den
      <em>anon public</em>-Schlüssel kopieren.</li>
    <li>Hier eintragen, Klassen-Code frei wählen (mind. 6 Zeichen) und verbinden.</li>
  </ol>

  <form id="dbForm" class="db-form" autocomplete="off" novalidate>
    <label class="field">
      <span>Projekt-URL</span>
      <input id="dbUrl" type="url" placeholder="https://abcdefgh.supabase.co">
    </label>
    <label class="field">
      <span>anon public key</span>
      <input id="dbKey" type="text" placeholder="eyJhbGciOi…">
    </label>
    <label class="field">
      <span>Klassen-Code (das ist das Passwort für eure Gruppe)</span>
      <input id="dbCode" type="text" placeholder="z.&nbsp;B. 9b-sport-2026">
    </label>
    <div class="db-actions">
      <button type="submit" class="btn btn-mint">Verbinden</button>
      <button type="button" id="dbTest" class="btn" title="Prüfen, ob der Datenbank-Server erreichbar ist">Verbindung testen</button>
      <button type="button" id="dbShare" class="btn" hidden title="Projekt-URL und Key für die eigene Website kopieren">Für Website kopieren</button>
      <button type="button" id="dbDisconnect" class="btn" hidden>Trennen</button>
    </div>
  </form>
  <p id="dbHint" class="hint-text"></p>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite">
  <span id="toastText"></span>
  <button id="toastAction" class="toast-action" hidden></button>
</div>

</template>

<div id="app"></div>

<!-- Verbindung zur Datenbank für alle Besucher dieser Seite.
     In der App: Übersicht → Datenbank verbinden → "Für Website kopieren",
     dann die folgende Zeile durch die kopierte ersetzen. Beispiel:
     {"url":"https://abcdefgh.supabase.co","key":"eyJhbGciOi…"}
     Der Klassen-Code gehört NICHT hierher – er bleibt auf jedem Gerät. -->

<script id="appState" type="application/json">null</script>
<script id="schemaSql" type="text/plain">/* SCHEMA_SQL */</script>
<script id="appScript" src="assets/app.js"></script>
</body>
</html>
